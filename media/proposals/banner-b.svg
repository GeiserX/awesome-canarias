<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <clipPath id="b-clip"><rect width="800" height="200" rx="16"/></clipPath>
    <linearGradient id="b-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/><stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
    <radialGradient id="b-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e2a05a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e2a05a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5530"/><stop offset="1" stop-color="#5a3419"/>
    </linearGradient>
    <linearGradient id="b-post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2a15"/><stop offset="0.35" stop-color="#8e5a33"/><stop offset="1" stop-color="#4f2d17"/>
    </linearGradient>
    <linearGradient id="b-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e3f28"/><stop offset="1" stop-color="#b8603e"/>
    </linearGradient>
    <linearGradient id="b-bal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2a15"/><stop offset="0.4" stop-color="#9a6238"/><stop offset="1" stop-color="#4a2a15"/>
    </linearGradient>
    <pattern id="b-balusters" x="0" y="154" width="20" height="34" patternUnits="userSpaceOnUse">
      <path d="M5,0 H15 V3 H12.5 V7 H14.5 V9 C16,12 16,17 15.5,20 C15,23 13.5,25 13,26 H14.5 V28 H15 V34 H5 V28 H5.5 V26 H7 C6.5,25 5,23 4.5,20 C4,17 4,12 5.5,9 V7 H7.5 V3 H5 Z" fill="url(#b-bal)"/>
    </pattern>
    <pattern id="b-tiles" x="0" y="0" width="40" height="18" patternUnits="userSpaceOnUse">
      <rect width="40" height="10" fill="#6e2c1a"/>
      <path d="M0,0 H20 V9 C20,15 16,18 10,18 C4,18 0,15 0,9 Z" fill="url(#b-tile)"/>
      <path d="M3,2 C3,11 6,14.5 10,15" fill="none" stroke="#e09470" stroke-width="1.2" opacity="0.55"/>
      <path d="M22,0 H38 V7 C38,11.5 34,13 30,13 C26,13 22,11.5 22,7 Z" fill="#7e3520"/>
      <path d="M22,7 C22,11.5 26,13 30,13 C34,13 38,11.5 38,7" fill="none" stroke="#3a150c" stroke-width="1"/>
      <path d="M0,9 C0,15 4,18 10,18 C16,18 20,15 20,9" fill="none" stroke="#3a150c" stroke-width="1"/>
    </pattern>
    <pattern id="b-lattice" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M-1,-1 L11,11 M-1,9 L1,11 M9,-1 L11,1" stroke="#7a4a28" stroke-width="2.2"/>
      <path d="M11,-1 L-1,11 M1,-1 L-1,1 M11,9 L9,11" stroke="#5a3419" stroke-width="2.2"/>
    </pattern>
    <filter id="b-blur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <g clip-path="url(#b-clip)">
    <rect width="800" height="200" fill="url(#b-bg)"/>
    <ellipse cx="400" cy="100" rx="300" ry="90" fill="url(#b-lamp)"/>
    <ellipse cx="400" cy="200" rx="260" ry="40" fill="#c77a3e" opacity="0.08" filter="url(#b-blur)"/>

    <!-- eave: teja árabe over the wooden beam -->
    <rect x="-12" y="-2" width="824" height="20" fill="url(#b-tiles)"/>
    <rect x="0" y="0" width="800" height="3" fill="#5a2415" opacity="0.8"/>
    <rect x="0" y="16" width="800" height="10" fill="url(#b-wood)"/>
    <rect x="0" y="16" width="800" height="1.5" fill="#b07a4a" opacity="0.6"/>
    <g fill="#5a3419">
      <path d="M8,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M48,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M88,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M128,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M168,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M208,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M248,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M288,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M328,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M368,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M408,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M448,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M488,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M528,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M568,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M608,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M648,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M688,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M728,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
      <path d="M768,26 h14 v4 c0,3 -3,5 -7,5 c-4,0 -7,-2 -7,-5 Z"/>
    </g>

    <!-- celosías in the outer bays -->
    <g>
      <rect x="34" y="40" width="92" height="104" fill="url(#b-lattice)"/>
      <rect x="674" y="40" width="92" height="104" fill="url(#b-lattice)"/>
      <g fill="none" stroke="#6e4224" stroke-width="3">
        <rect x="35.5" y="41.5" width="89" height="101"/>
        <rect x="675.5" y="41.5" width="89" height="101"/>
      </g>
    </g>

    <!-- pies derechos with carved zapatas -->
    <g>
      <rect x="18" y="26" width="16" height="122" fill="url(#b-post)"/>
      <path d="M2,26 H50 V30 C44,30 42,33 40,36 C38,39 36,40 34,40 H18 C16,40 14,39 12,36 C10,33 8,30 2,30 Z" fill="#6e4224"/>
      <rect x="126" y="26" width="16" height="122" fill="url(#b-post)"/>
      <path d="M110,26 H158 V30 C152,30 150,33 148,36 C146,39 144,40 142,40 H126 C124,40 122,39 120,36 C118,33 116,30 110,30 Z" fill="#6e4224"/>
      <rect x="658" y="26" width="16" height="122" fill="url(#b-post)"/>
      <path d="M642,26 H690 V30 C684,30 682,33 680,36 C678,39 676,40 674,40 H658 C656,40 654,39 652,36 C650,33 648,30 642,30 Z" fill="#6e4224"/>
      <rect x="766" y="26" width="16" height="122" fill="url(#b-post)"/>
      <path d="M750,26 H798 V30 C792,30 790,33 788,36 C786,39 784,40 782,40 H766 C764,40 762,39 760,36 C758,33 756,30 750,30 Z" fill="#6e4224"/>
    </g>

    <!-- balustrade -->
    <rect x="0" y="154" width="800" height="34" fill="url(#b-balusters)"/>
    <rect x="0" y="144" width="800" height="10" fill="url(#b-wood)"/>
    <rect x="0" y="144" width="800" height="2" fill="#c08a58" opacity="0.7"/>
    <rect x="0" y="153" width="800" height="1" fill="#2c180b" opacity="0.8"/>
    <rect x="0" y="188" width="800" height="7" fill="url(#b-wood)"/>
    <rect x="0" y="188" width="800" height="1.5" fill="#b07a4a" opacity="0.6"/>
    <rect x="0" y="195" width="800" height="5" fill="#3a2010"/>

    <text x="400" y="90" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" fill="#ffffff" font-weight="700" letter-spacing="0.5">awesome-canarias</text>
    <rect x="370" y="102" width="60" height="2.5" rx="1.25" fill="#c98a52"/>
    <text x="400" y="126" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.7" font-weight="500" letter-spacing="2.5">SOFTWARE OPEN SOURCE PARA LAS ISLAS CANARIAS</text>
  </g>
</svg>
